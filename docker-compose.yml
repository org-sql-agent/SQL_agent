services:
  api:
    build: .
    container_name: sql-agent-api
    command: >
      sh -c "python -m app.db.init_db &&
             uvicorn app.main:app --host 0.0.0.0 --port 8080 --reload"
    ports:
      - "8080:8080"
    volumes:
      - .:/app
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3

  ui:
    build: .
    container_name: sql-agent-ui
    command: >
      streamlit run app/web/ui.py
      --server.port=1111
      --server.address=0.0.0.0
    ports:
      - "1111:1111"
    volumes:
      - .:/app
    environment:
      SERVICE_API_URL: http://api:8080/Service
    env_file:
      - .env
    depends_on:
      api:
        condition: service_healthy

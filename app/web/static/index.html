<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Titanic AI Agent 🚢</title>
  <link rel="stylesheet" href="/static/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <script src="/config.js"></script>
</head>
<body>

  <!-- ── Header ─────────────────────────────────────────────────────── -->
  <header class="header">
    <div class="header-left">
      <span class="header-logo">🚢</span>
      <h1 class="header-title">Titanic AI Agent</h1>
    </div>
    <button class="clear-btn" id="clear-btn" title="清除對話">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none"
        viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6M1 7h22M8 7V5a2 2 0 012-2h4a2 2 0 012 2v2" />
      </svg>
      清除對話
    </button>
  </header>

  <!-- ── Chat area ───────────────────────────────────────────────────── -->
  <main class="chat-container" id="chat-container">
    <div class="messages" id="messages">

      <!-- 歡迎訊息（沒有對話時顯示） -->
      <div class="welcome" id="welcome">
        <div class="welcome-icon">🚢</div>
        <h2>Titanic AI Agent</h2>
        <p>我可以幫你查詢泰坦尼克號乘客資料、繪製統計圖表，以及預測生還率。</p>
      </div>

    </div>
  </main>

  <!-- ── Input area ──────────────────────────────────────────────────── -->
  <footer class="input-area">
    <!-- 快速提示按鈕：永遠顯示在輸入框上方 -->
    <div class="hint-bar">
      <button class="hint-btn" data-hint="泰坦尼克號的整體生還率是多少？">整體生還率</button>
      <button class="hint-btn" data-hint="畫出各艙等的生還率關係圖">艙等生還率圖</button>
      <button class="hint-btn" data-hint="預測一位30歲女性頭等艙乘客的生還率">預測一位30歲女性頭等艙乘客的生還率</button>
    </div>
    <div class="input-wrapper">
      <textarea
        id="user-input"
        class="user-input"
        placeholder="請輸入問題，例如：生還率多少？畫出生還率和艙等關係…"
        rows="1"
      ></textarea>
      <button class="send-btn" id="send-btn" title="送出 (Enter)">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none"
          viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14M12 5l7 7-7 7" />
        </svg>
      </button>
    </div>
    <p class="input-hint">Enter 送出 · Shift+Enter 換行</p>
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
